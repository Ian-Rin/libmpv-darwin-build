# This fork builds the one archive PiliPlus takes, the iOS video
# xcframeworks (default flavor), with ffmpeg patched to decode through
# VideoToolbox without waiting for each frame
# (patches/ffmpeg-videotoolbox-async.patch). Upstream's workflow builds
# all 246.
#
# A tag builds a release with the archive attached; a push to main or a
# run by hand builds the same and keeps it as the run's artifact.
name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Platform info
        run: |
          printf "%-23s %s\n" "ProductName:"    "$(/usr/bin/sw_vers -productName)"
          printf "%-23s %s\n" "ProductVersion:" "$(/usr/bin/sw_vers -productVersion)"
          printf "%-23s %s\n" "BuildVersion:"   "$(/usr/bin/sw_vers -buildVersion)"
          printf "%-23s %s\n" "Arch:"           "$(uname -m)"

      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      # See ${workspace}/nix/overlays/xcode.nix
      - name: Xcode path
        id: xcode_path
        run: |
          XCODE_PATH=$(realpath /Applications/Xcode_16.1.0.app)

          ${XCODE_PATH}/Contents/Developer/usr/bin/xcodebuild -version

          echo "xcode_path=${XCODE_PATH}" >> $GITHUB_OUTPUT

      - name: Build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # See ${workspace}/Makefile
      - name: Build
        env:
          XCODE_PATH: ${{ steps.xcode_path.outputs.xcode_path }}
          VERSION: ${{ steps.version.outputs.version }}
        # bash, for pipefail: the build's failure, not tee's success.
        shell: bash
        run: |
          nix develop -c make XCODE_PATH=${XCODE_PATH} VERSION=${VERSION} \n            TARGET=mk-out-archive-xcframeworks-ios-universal-video-default 2>&1 | tee build.log

      # A run's log needs a login to read; its annotations do not. The lines
      # that say what failed, and the log's end, go there.
      - name: Say why the build failed
        if: failure()
        shell: bash
        run: |
          # grep finding nothing must not end this step (bash here has
          # -e and pipefail): it did, and the failure said nothing.
          set +e +o pipefail
          test -f build.log || exit 0
          echo "::error title=build log size::$(wc -l < build.log) lines"
          annotate() {
            local title=$1 body
            body=$(sed -e 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            test -n "$body" && echo "::error title=${title}::${body}"
            return 0
          }
          grep -n -E "error:|Error:|FAILED|fatal error|No such file" build.log | tail -n 30 | annotate "errors in the build log"
          tail -n 90 build.log | head -n 30 | annotate "build log 90 to 60 lines from its end"
          tail -n 60 build.log | head -n 30 | annotate "build log 60 to 30 lines from its end"
          tail -n 30 build.log | annotate "build log last 30 lines"
          head -n 30 build.log | annotate "build log first 30 lines"

      - name: Checksum
        shell: bash
        run: |
          cd result
          echo "::notice title=sha256::$(shasum -a 256 *.tar.gz | awk '{printf "%s  %s%%0A", $1, $2}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: |
            result/*.tar.gz
            result/*.zip

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            result/*.tar.gz
            result/*.zip
