# The one output PiliPlus takes: the iOS video xcframeworks (default flavor).
# The other 54 the upstream workflow builds (macOS, the simulator alone, the
# audio and GPL variants) are left out: an hour and more of a Mac each run.
#
# A tag builds a release with the archive attached; a push to main or a run
# by hand builds the same and keeps it as the run's artifact.
name: ci

on:
  push:
    branches: [main, mpv-0.39]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # macos-14, which this was built on until November 2026, is gone ("The
    # configuration 'macos-14-arm64-us-default' is not supported").
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cmake too: macos-14's image had it, macos-15's does not ("mbedtls|
      # Found CMake: NO"). The build links what it needs from the PATH here
      # into a PATH of its own.
      - name: Install requirements
        run: brew install go ninja nasm make cmake

      # meson from pip under a Python of the time this was last built (late
      # 2024), not Homebrew's: its meson runs under Homebrew's Python, 3.15
      # by now, and libplacebo 7.349's generators (run by meson's Python) do
      # not: "utils_gen.py ... TypeError: expected an Element, not
      # ElementTree".
      - name: Python for meson
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install meson
        run: python -m pip install meson==1.6.0

      - name: Print tool versions
        run: gmake tool-versions

      # Readable without a login, as the failure below: which tools the
      # build will link into its own PATH. One notice, not one a tool.
      - name: Say where the tools are
        shell: bash
        run: |
          tools=""
          for tool in meson ninja cmake nasm; do
            tools="${tools}${tool}: $(which ${tool} || echo missing) $(${tool} --version 2>&1 | head -n 1)%0A"
          done
          echo "::notice title=tools::${tools}"

      - name: Determine version
        id: version
        shell: bash
        run: |
          case "${GITHUB_REF}" in
          refs/tags/*)
            VERSION=${GITHUB_REF#refs/tags/}
            ;;
          *)
            VERSION=develop
            ;;
          esac

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo ${VERSION}

      - name: Build
        # bash, for pipefail: the build's failure, not tee's success.
        # -k: a package that fails does not stop the ones that do not need
        # it, so that one run says all that is wrong with them, not the
        # first.
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gmake -k build/output/libmpv-xcframeworks_${VERSION}_ios-universal-video-default.tar.gz 2>&1 | tee build.log

      # A run's log needs a login to read; its annotations do not (ten of a
      # kind for a step). What failed, the errors, the lines before each
      # failure and the log's end go there.
      - name: Say why the build failed
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          test -f build.log || exit 0
          annotate() {
            local title=$1 body
            body=$(sed -e 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            test -n "$body" && echo "::error title=${title}::${body}"
            return 0
          }
          grep -n -E "^gmake(\[[0-9]+\])?: \*\*\* " build.log | head -n 40 | annotate "failed targets"
          grep -E "fatal error:|: error:|^FAILED|ERROR:|Traceback|Error: |^ld: |Undefined symbols|No such file or directory|command not found" build.log \
            | awk '!seen[$0]++' | head -n 40 | annotate "errors in the build log"
          grep -n -B 14 -E "^gmake(\[[0-9]+\])?: \*\*\* " build.log > before.log
          sed -n '1,30p' before.log | annotate "before the failures 1"
          sed -n '31,60p' before.log | annotate "before the failures 2"
          sed -n '61,90p' before.log | annotate "before the failures 3"
          sed -n '91,120p' before.log | annotate "before the failures 4"
          tail -n 30 build.log | annotate "build log last 30 lines"

      - name: Checksum
        shell: bash
        run: |
          cd build/output
          shasum -a 256 *.tar.gz | tee SHA256SUMS.txt
          echo "::notice title=sha256::$(awk '{printf "%s  %s%%0A", $1, $2}' SHA256SUMS.txt)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: |
            build/output/*.tar.gz
            build/output/SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            build/output/*.tar.gz
            build/output/SHA256SUMS.txt
