# The one output PiliPlus takes: the iOS video xcframeworks (default flavor).
# The other 54 the upstream workflow builds (macOS, the simulator alone, the
# audio and GPL variants) are left out: an hour and more of a Mac each run.
#
# A tag builds a release with the archive attached; a push to main or a run
# by hand builds the same and keeps it as the run's artifact.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # macos-14, which this was built on until November 2026, is gone ("The
    # configuration 'macos-14-arm64-us-default' is not supported").
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cmake too: macos-14's image had it, macos-15's does not ("mbedtls|
      # Found CMake: NO"). The build links what it needs from the PATH here
      # into a PATH of its own.
      - name: Install requirements
        run: brew install go meson ninja nasm make cmake

      - name: Print tool versions
        run: gmake tool-versions

      - name: Determine version
        id: version
        shell: bash
        run: |
          case "${GITHUB_REF}" in
          refs/tags/*)
            VERSION=${GITHUB_REF#refs/tags/}
            ;;
          *)
            VERSION=develop
            ;;
          esac

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo ${VERSION}

      - name: Build
        # bash, for pipefail: the build's failure, not tee's success.
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gmake build/output/libmpv-xcframeworks_${VERSION}_ios-universal-video-default.tar.gz 2>&1 | tee build.log

      # A run's log needs a login to read; its annotations do not. The lines
      # that say what failed, and the log's end, go there.
      - name: Say why the build failed
        if: failure()
        shell: bash
        run: |
          test -f build.log || exit 0
          annotate() {
            local title=$1 body
            body=$(sed -e 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            test -n "$body" && echo "::error title=${title}::${body}"
            return 0
          }
          grep -n -E "error:|Error:|FAILED|fatal|undefined|Undefined|No such file|not found" build.log | tail -n 30 | annotate "errors in the build log"
          tail -n 90 build.log | head -n 30 | annotate "build log, 90 to 60 lines from its end"
          tail -n 60 build.log | head -n 30 | annotate "build log, 60 to 30 lines from its end"
          tail -n 30 build.log | annotate "build log, its last 30 lines"

      - name: Checksum
        shell: bash
        run: |
          cd build/output
          shasum -a 256 *.tar.gz | tee SHA256SUMS.txt
          echo "::notice title=sha256::$(awk '{printf "%s  %s%%0A", $1, $2}' SHA256SUMS.txt)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            build/output/*.tar.gz
            build/output/SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            build/output/*.tar.gz
            build/output/SHA256SUMS.txt
