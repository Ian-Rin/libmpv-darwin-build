# Laid over a cross file by the two packages that are CMake projects
# (mbedtls, uchardet): for the machine a cross build is for, meson takes
# cmake only from a cross file's binaries. Not in the cross files
# themselves: with cmake to hand meson also looks dependencies up with it,
# and found libpng's zlib in the macOS SDK for an iOS build.
[binaries]
cmake = ['cmake']
